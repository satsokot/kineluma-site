name: KineLuma Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-dist/**'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Prepare deploy bundle
        if: github.event_name == 'push'
        run: |
          rm -rf deploy-dist
          mkdir -p deploy-dist
          cp -R out/. deploy-dist/
      - name: Commit deploy bundle
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-dist
          if git diff --cached --quiet; then
            echo "Deploy bundle unchanged"
          else
            git commit -m "chore: update deploy bundle [skip ci]"
            git push
          fi
